# nefarious2 conformance server (local only): base.conf from the image,
# local.conf beside this file, and IAuth SASL from a static users file so a
# test account can log in with no services.
include "base.conf";
include "local.conf";

IAuth {
    program = "node" "/home/nefarious/ircd/iauthd-ts/dist/index.js" "-v" "-c" "/home/nefarious/ircd/ircd.conf";
};

#IAUTH POLICY SRTAWUwFr
#IAUTH SASLDB /home/nefarious/ircd/saslusers
#IAUTH SASLFAILMSG Invalid username or password
