# Build the static client and publish it to GitHub Pages.
#
# Upstream (evilnet/seance) publishes on a release only, so
# https://evilnet.github.io/seance/ always serves the latest release. A fork
# has its own, independent Pages site that upstream never touches, and for a
# fork the useful trigger is a push to one branch of its own: develop, or
# the branch named by a PAGES_BRANCH repository variable (a preview branch,
# say) — so the push trigger below is live everywhere except upstream. The
# fork's Pages source has to be "GitHub Actions", and its github-pages
# environment has to allow deployments from that branch. `workflow_dispatch`
# works anywhere.
#
# Only one thing can be published: with the "GitHub Actions" Pages source a
# deployment is the whole site, so a second target (a /dev/ subpath, a PR
# preview) is not possible without moving to a gh-pages branch.
#
# The SPA uses relative asset paths and a hash router, so it works under the
# /seance/ subpath unchanged. Pages is HTTPS, so from there only wss://
# servers are reachable (mixed content blocks ws://).
name: Pages

on:
  release:
    types: [published]
  push:
    branches:
      - develop
      - preview
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Upstream deploys releases; a fork also deploys its develop, or the
    # branch its PAGES_BRANCH variable names instead.
    if: >-
      github.event_name != 'push' ||
      (github.repository != 'evilnet/seance' &&
       github.ref == format('refs/heads/{0}', vars.PAGES_BRANCH || 'develop'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          # Tags and history, so that a build without SEANCE_VERSION can name
          # itself `<latest tag>-<short sha>` (webpack.config.ts resolveVersion).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Enable Yarn (classic) via corepack
        run: corepack enable

      - name: Install
        run: yarn --frozen-lockfile --non-interactive

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production
          SEANCE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
