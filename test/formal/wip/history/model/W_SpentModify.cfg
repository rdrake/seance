\* W_SpentModify: witness (D40): V4Spent with altered echoes: an unlabeled echo the server altered to another copy's text settles that copy (ConfirmedByOwnOrTwin fails): the fallback matches by content, so it cannot place an altered echo. Seance #297 has the same limit.
