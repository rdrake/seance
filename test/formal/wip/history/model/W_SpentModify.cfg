  Labels = {"l1", "l2"}
  Texts = {"a", "b"}
  MaxReq = 2
  Lossy = FALSE
  Deferred = FALSE
  Fallback = TRUE
  ErrFallback = FALSE
  LateErr = FALSE
  OtherSession = FALSE
  SelfMsg = FALSE
  TimeoutOn = FALSE
  MaxLate = 2
  Competing = FALSE
  CloseOn = FALSE
  History = FALSE
  Notice = FALSE
  Modify = TRUE
  SpentLabel = TRUE
  LabelledEchoes = TRUE
INVARIANTS
  TypeOK
  LabelOnce
  ConfirmedByOwnOrTwin
CHECK_DEADLOCK FALSE
