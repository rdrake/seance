\* W_SpentSelfDeliv: witness (D40): V4Spent with self-messages: copy B, confirmed by its own labeled echo, has its delivered copy settle a spent same-text copy A before A's unlabeled echo arrives (NoCrossFromConfirmedDeliv and ConfirmedByOwnOrTwin fail): a delivered copy to ourselves looks like an echo, so #297's fallback takes it
SPECIFICATION Spec
CONSTANTS
  Labels = {"l1", "l2"}
  Texts = {"a", "b"}
  MaxReq = 2
  Lossy = FALSE
  Deferred = FALSE
  Fallback = TRUE
  ErrFallback = FALSE
  LateErr = FALSE
  OtherSession = FALSE
  SelfMsg = TRUE
  TimeoutOn = FALSE
  MaxLate = 2
  Competing = FALSE
  CloseOn = FALSE
  History = FALSE
  Notice = FALSE
  Modify = FALSE
  SpentLabel = TRUE
  LabelledEchoes = TRUE
INVARIANTS
  TypeOK
  NoCrossFromConfirmedDeliv
CHECK_DEADLOCK FALSE
