\* W_LateFallback: witness: BaseFallback with Lossy on: a late unlabeled echo settles another pending copy with the same text, timed out or not (ConfirmedByOwn fails). The after-timeout story is W_LateTimedOut.
SPECIFICATION Spec
CONSTANTS
  Labels = {"l1", "l2"}
  Texts = {"a", "b"}
  MaxReq = 2
  Lossy = TRUE
  Deferred = FALSE
  Fallback = TRUE
  OtherSession = FALSE
  SelfMsg = FALSE
  TimeoutOn = TRUE
  MaxLate = 2
  Competing = FALSE
  CloseOn = FALSE
  History = FALSE
  Notice = FALSE
  Modify = FALSE
INVARIANTS
  TypeOK
  ConfirmedByOwn
CHECK_DEADLOCK FALSE
