\* W_LateTimedOut: witness: Lossy with fallback: a timed-out copy's late echo settles another copy (NoCrossFromTimedOut fails)
SPECIFICATION Spec
CONSTANTS
  Labels = {"l1", "l2"}
  Texts = {"a", "b"}
  MaxReq = 2
  Lossy = TRUE
  Deferred = FALSE
  Fallback = TRUE
  OtherSession = FALSE
  SelfMsg = FALSE
  TimeoutOn = TRUE
INVARIANTS
  TypeOK
  NoCrossFromTimedOut
CHECK_DEADLOCK FALSE
